---
- hosts: localhost
  connection: local

  vars_files:
    - config.yml

  pre_tasks:
    - name: Check whether local Ansible config file exists.
      stat:
        path: "{{ playbook_dir }}/config.local.yml"
      register: local_config_file
      tags:
        - always

    - name: Load local Ansible config file when present.
      include_vars:
        file: "{{ playbook_dir }}/config.local.yml"
      when: local_config_file.stat.exists
      tags:
        - always

  roles:
    - role: setup_homebrew
    - role: setup_gpg
      when: configure_gpg
    - role: setup_ssh
      when: configure_ssh
    - role: setup_github_keys
      when: configure_github_keys
    - role: setup_github_keys
      when: configure_github_enterprise_keys
      vars:
        github_keys_host: "{{ github_enterprise_hostname }}"
        github_keys_gpg_title: "{{ github_enterprise_gpg_key_title | default('Mac DevOps GPG Key') }}"
        github_keys_ssh_title: "{{ github_enterprise_ssh_key_title | default('Mac DevOps SSH Key') }}"
    - role: setup_dotfiles
      when: configure_dotfiles
    - role: setup_terminal
      when: configure_terminal
    - role: setup_macos
      when: configure_osx

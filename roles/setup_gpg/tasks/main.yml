---
- name: Validate always-required GPG variables.
  assert:
    that:
      - gpg_key_name | length > 0
      - gpg_key_email | length > 0
    fail_msg: "Set gpg_key_name and gpg_key_email in config.local.yml before running this role."
  tags: gpg

- name: Check whether a secret key already exists for the configured email.
  command: gpg --list-secret-keys --with-colons "{{ gpg_key_email }}"
  register: existing_gpg_keys
  changed_when: false
  failed_when: false
  become: false
  tags: gpg

- name: Check whether GPG passphrase is already stored in macOS Keychain.
  command: security find-generic-password -a "{{ ansible_facts['user_id'] }}" -s "{{ gpg_keychain_service_name }}"
  register: gpg_keychain_check
  changed_when: false
  failed_when: false
  become: false
  tags: gpg

- name: Validate GPG passphrase when key or Keychain entry is missing.
  assert:
    that:
      - gpg_key_passphrase | default('') | length > 0
    fail_msg: "Set gpg_key_passphrase in config.local.yml before running this role."
  when: >-
    ('sec:' not in existing_gpg_keys.stdout) or
    (gpg_keychain_check.rc != 0)
  tags: gpg

- name: Generate GPG key when missing.
  command: >-
    gpg --batch --yes --pinentry-mode loopback
    --passphrase {{ gpg_key_passphrase | quote }}
    --quick-generate-key
    {{ (gpg_key_name ~ ' <' ~ gpg_key_email ~ '>') | quote }}
    {{ gpg_key_type | quote }}
    {{ gpg_key_usage | quote }}
    {{ gpg_key_expire | quote }}
  when: "'sec:' not in existing_gpg_keys.stdout"
  no_log: true
  become: false
  tags: gpg

- name: Reload gpg-agent after config updates.
  command: gpgconf --kill gpg-agent
  changed_when: false
  failed_when: false
  become: false
  tags: gpg

- name: Store GPG passphrase in macOS Keychain.
  command: >-
    security add-generic-password
    -a {{ ansible_facts['user_id'] | quote }}
    -s {{ gpg_keychain_service_name | quote }}
    -w {{ gpg_key_passphrase | quote }}
    -U
  no_log: true
  changed_when: false
  become: false
  when: gpg_keychain_check.rc != 0
  tags: gpg

---
# Bootstrap.
- name: Run Homebrew bootstrap.
  block:
    - name: Install Xcode Command Line Tools.
      import_tasks: osx-commandline.yml

    - name: Install Homebrew.
      import_tasks: install-homebrew.yml
  rescue:
    - name: Mark bootstrap failure for reporting.
      set_fact:
        homebrew_bootstrap_failed: true
        homebrew_bootstrap_error: "{{ ansible_failed_result.msg | default('unknown bootstrap error') }}"
      tags: homebrew

- name: Check for Homebrew at Apple Silicon path.
  stat:
    path: /opt/homebrew/bin/brew
  register: homebrew_brew_opt
  tags: homebrew

- name: Check for Homebrew at Intel path.
  stat:
    path: /usr/local/bin/brew
  register: homebrew_brew_usr_local
  tags: homebrew

- name: Set Homebrew availability facts.
  set_fact:
    homebrew_brew_available: "{{ homebrew_brew_opt.stat.exists or homebrew_brew_usr_local.stat.exists }}"
    homebrew_brew_bin: >-
      {{ '/opt/homebrew/bin/brew' if homebrew_brew_opt.stat.exists else
         ('/usr/local/bin/brew' if homebrew_brew_usr_local.stat.exists else '') }}
  tags: homebrew

# Tap.
- name: Ensure configured taps are tapped.
  community.general.homebrew_tap:
    tap: '{{ item.name | default(item) }}'
    url: '{{ item.url | default(omit) }}'
    state: present
  loop: "{{ homebrew_taps }}"
  register: homebrew_taps_result
  when: homebrew_brew_available
  tags: homebrew

# Brew.
- name: Ensure configured homebrew packages are installed ( This step will take a while depending on number of brews to install )
  community.general.homebrew:
    name: "{{ item.name | default(item) }}"
    install_options: "{{ item.install_options | default(omit) }}"
    state: present
  loop: "{{ homebrew_installed_packages }}"
  register: homebrew_packages_result
  when: homebrew_brew_available
  tags: homebrew

- name: Upgrade all homebrew packages (if configured).
  community.general.homebrew:
    update_homebrew: yes
    upgrade_all: yes
  register: homebrew_upgrade_result
  when: homebrew_brew_available and homebrew_upgrade_all_packages
  tags: homebrew

# Cask.
- name: Install configured cask applications.
  community.general.homebrew_cask:
    name: "{{ item.name | default(item) }}"
    state: present
    install_options: "{{ item.install_options | default('appdir=' + homebrew_cask_appdir) }}"
  loop: "{{ homebrew_cask_apps }}"
  register: homebrew_casks_result
  when: homebrew_brew_available
  tags: homebrew

- name: Build Homebrew setup report.
  set_fact:
    homebrew_setup_report:
      bootstrap_status: "{{ 'failed' if (homebrew_bootstrap_failed | default(false)) else 'ok' }}"
      bootstrap_error: "{{ homebrew_bootstrap_error | default('') }}"
      brew_binary_exists: "{{ homebrew_brew_available }}"
      brew_binary_path: "{{ homebrew_brew_bin }}"
      taps_applied: "{{ homebrew_brew_available and (homebrew_taps_result is defined) }}"
      packages_applied: "{{ homebrew_brew_available and (homebrew_packages_result is defined) }}"
      casks_applied: "{{ homebrew_brew_available and (homebrew_casks_result is defined) }}"
      package_and_cask_status: "{{ 'applied' if homebrew_brew_available else 'skipped_no_brew_binary' }}"
  tags: homebrew

- name: Report partial result when Homebrew binary is unavailable.
  debug:
    var: homebrew_setup_report
  when: not homebrew_brew_available
  tags: homebrew

---
- name: Validate always-required SSH key variables.
  assert:
    that:
      - ssh_key_name | default('') | length > 0
    fail_msg: "Set ssh_key_name in config.local.yml before running this role."
  tags: ssh

- name: Check whether SSH private key already exists.
  stat:
    path: "{{ ssh_key_path }}"
  register: ssh_key_stat
  tags: ssh

- name: Validate SSH key generation variables when key is missing.
  assert:
    that:
      - ssh_key_comment | length > 0
      - ssh_key_passphrase | length > 0
    fail_msg: "Set ssh_key_comment and ssh_key_passphrase in config.local.yml before running this role."
  when: not ssh_key_stat.stat.exists
  tags: ssh

- name: Ensure SSH directory exists.
  file:
    path: "{{ ssh_dir }}"
    state: directory
    mode: "0700"
  become: false
  tags: ssh

- name: Generate SSH private key when missing.
  command: >-
    ssh-keygen -t {{ ssh_key_type | quote }}
    -f {{ ssh_key_path | quote }}
    -C {{ ssh_key_comment | quote }}
    -N {{ ssh_key_passphrase | quote }}
  args:
    creates: "{{ ssh_key_path }}"
  no_log: true
  become: false
  tags: ssh

- name: Ensure SSH public key permissions are secure.
  file:
    path: "{{ ssh_key_path }}.pub"
    mode: "0644"
  become: false
  tags: ssh

- name: Ensure SSH private key permissions are secure.
  file:
    path: "{{ ssh_key_path }}"
    mode: "0600"
  become: false
  tags: ssh

- name: Ensure SSH config enables keychain usage on macOS.
  blockinfile:
    path: "{{ ssh_dir }}/config"
    create: true
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED SSH KEYCHAIN"
    block: |
      Host *
        AddKeysToAgent yes
        UseKeychain yes
        IdentityFile {{ ssh_key_path }}
  become: false
  tags: ssh

- name: Add SSH private key to macOS keychain.
  command: >-
    ssh-add {{ ssh_keychain_add_command }} {{ ssh_key_path | quote }}
  changed_when: false
  failed_when: false
  no_log: true
  become: false
  tags: ssh

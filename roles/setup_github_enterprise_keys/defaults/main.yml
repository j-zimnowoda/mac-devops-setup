---
github_enterprise_keys_home: "{{ ansible_facts['env']['HOME'] | default(lookup('ansible.builtin.env', 'HOME')) }}"
github_enterprise_keys_hostname: "{{ github_enterprise_hostname | default('') }}"
github_enterprise_keys_gpg_export_email: "{{ gpg_key_email | default(gitconfig_email | default('')) }}"
github_enterprise_keys_gpg_title: "Mac DevOps GPG Key"
github_enterprise_keys_ssh_public_key_path: "{{ github_enterprise_keys_home }}/.ssh/id_ed25519.pub"
github_enterprise_keys_ssh_title: "Mac DevOps SSH Key"
github_enterprise_keys_ssh_type: authentication

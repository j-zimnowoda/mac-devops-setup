---
- name: Validate GitHub Enterprise hostname is set.
  assert:
    that:
      - github_enterprise_keys_hostname | length > 0
    fail_msg: "Set github_enterprise_hostname in config.local.yml before running GitHub Enterprise key upload role."
  tags: github_enterprise_keys

- name: Check that gh CLI is installed.
  command: gh --version
  register: gh_version
  changed_when: false
  failed_when: gh_version.rc != 0
  tags: github_enterprise_keys

- name: Check gh authentication status for GitHub Enterprise.
  command: gh auth status
  register: ghe_auth_status
  changed_when: false
  failed_when: ghe_auth_status.rc != 0
  environment:
    GH_HOST: "{{ github_enterprise_keys_hostname }}"
  tags: github_enterprise_keys

- name: Inspect local secret keys when GPG export email is not set.
  command: gpg --list-secret-keys --with-colons
  register: ghe_local_secret_keys
  changed_when: false
  failed_when: false
  when: github_enterprise_keys_gpg_export_email | length == 0
  tags: github_enterprise_keys

- name: Resolve effective GPG export email.
  set_fact:
    github_enterprise_keys_effective_gpg_export_email: >-
      {{
        github_enterprise_keys_gpg_export_email
        if github_enterprise_keys_gpg_export_email | length > 0
        else (
          ghe_local_secret_keys.stdout
          | regex_search('[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}')
          | default('', true)
        )
      }}
  tags: github_enterprise_keys

- name: Validate required key upload variables.
  assert:
    that:
      - github_enterprise_keys_effective_gpg_export_email | length > 0
      - github_enterprise_keys_gpg_title | length > 0
      - github_enterprise_keys_ssh_title | length > 0
    fail_msg: "Set gpg_key_email (or gitconfig_email) in config.local.yml, or create a local secret key with an email UID before running GitHub Enterprise key upload role."
  tags: github_enterprise_keys

- name: Ensure SSH public key exists before upload.
  stat:
    path: "{{ github_enterprise_keys_ssh_public_key_path }}"
  register: ghe_ssh_pubkey_stat
  tags: github_enterprise_keys

- name: Fail if SSH public key is missing.
  assert:
    that:
      - ghe_ssh_pubkey_stat.stat.exists
    fail_msg: "SSH public key not found at {{ github_enterprise_keys_ssh_public_key_path }}. Run the SSH setup role first."
  tags: github_enterprise_keys

- name: Read SSH public key content.
  slurp:
    src: "{{ github_enterprise_keys_ssh_public_key_path }}"
  register: ghe_ssh_pubkey_content
  tags: github_enterprise_keys

- name: Export local GPG public key.
  command: gpg --armor --export "{{ github_enterprise_keys_effective_gpg_export_email }}"
  register: ghe_gpg_public_key
  changed_when: false
  failed_when: ghe_gpg_public_key.rc != 0 or ghe_gpg_public_key.stdout | trim | length == 0
  tags: github_enterprise_keys

- name: Query GitHub Enterprise GPG keys.
  command: gh api user/gpg_keys --jq '.[].raw_key'
  register: ghe_existing_gpg_keys
  changed_when: false
  failed_when: false
  environment:
    GH_HOST: "{{ github_enterprise_keys_hostname }}"
  tags: github_enterprise_keys

- name: Write exported GPG key to temporary file.
  tempfile:
    state: file
    suffix: .asc
  register: ghe_gpg_tempfile
  when: not ansible_check_mode
  tags: github_enterprise_keys

- name: Persist exported GPG key into temporary file.
  copy:
    dest: "{{ ghe_gpg_tempfile.path }}"
    mode: "0600"
    content: "{{ ghe_gpg_public_key.stdout }}"
  when: not ansible_check_mode
  tags: github_enterprise_keys

- name: Upload GPG key to GitHub Enterprise when missing.
  command: >-
    gh gpg-key add {{ ghe_gpg_tempfile.path | quote }}
    --title {{ github_enterprise_gpg_key_title | default(github_enterprise_keys_gpg_title) | quote }}
  when:
    - not ansible_check_mode
    - ghe_gpg_public_key.stdout | trim not in ghe_existing_gpg_keys.stdout
  environment:
    GH_HOST: "{{ github_enterprise_keys_hostname }}"
  tags: github_enterprise_keys

- name: Query GitHub Enterprise SSH keys.
  command: gh api user/keys --jq '.[].key'
  register: ghe_existing_ssh_keys
  changed_when: false
  failed_when: false
  environment:
    GH_HOST: "{{ github_enterprise_keys_hostname }}"
  tags: github_enterprise_keys

- name: Upload SSH key to GitHub Enterprise when missing.
  command: >-
    gh ssh-key add {{ github_enterprise_keys_ssh_public_key_path | quote }}
    --title {{ github_enterprise_ssh_key_title | default(github_enterprise_keys_ssh_title) | quote }}
    --type {{ github_enterprise_keys_ssh_type | quote }}
  when:
    - not ansible_check_mode
    - (ghe_ssh_pubkey_content.content | b64decode | trim) not in ghe_existing_ssh_keys.stdout
  environment:
    GH_HOST: "{{ github_enterprise_keys_hostname }}"
  tags: github_enterprise_keys

- name: Remove temporary exported GPG key file.
  file:
    path: "{{ ghe_gpg_tempfile.path }}"
    state: absent
  when:
    - not ansible_check_mode
    - ghe_gpg_tempfile.path is defined
  tags: github_enterprise_keys

---
- name: Ensure managed dotfiles directory exists.
  file:
    path: "{{ dotfiles_repo_local_destination }}"
    state: directory
    mode: "0755"
  become: false
  tags: dotfiles

- name: Discover all templates for dotfiles.
  find:
    paths: "{{ role_path }}/templates"
    recurse: true
    hidden: true
    file_type: file
  register: discovered_templates
  delegate_to: localhost
  become: false
  tags: dotfiles

- name: Initialize templated dotfiles list.
  set_fact:
    templated_dotfiles: []
  tags: dotfiles

- name: Build templated dotfiles list from templates directory.
  set_fact:
    templated_dotfiles: "{{ templated_dotfiles + [template_relpath] }}"
  vars:
    template_relpath: "{{ item.path.split('/templates/', 1)[1] }}"
  loop: "{{ discovered_templates.files | sort(attribute='path') }}"
  tags: dotfiles

- name: Ensure managed dotfiles directory is a git repository.
  command: git init "{{ dotfiles_repo_local_destination }}"
  args:
    creates: "{{ dotfiles_repo_local_destination }}/.git"
  become: false
  tags: dotfiles

- name: Ensure parent directories exist for templated dotfiles.
  file:
    path: "{{ dotfiles_repo_local_destination }}/{{ item }}"
    state: directory
    mode: "0755"
  become: false
  loop: "{{ templated_dotfiles | map('dirname') | reject('equalto', '.') | unique | list }}"
  tags: dotfiles

- name: Look up GPG signing key fingerprint from keyring.
  shell: >
    gpg --list-keys --with-colons {{ gpg_key_name | quote }} 2>/dev/null |
    awk -F: '/^fpr/{print $10; exit}'
  register: _gpg_signing_key_lookup
  changed_when: false
  failed_when: false
  become: false
  when:
    - gitconfig_signingkey | length == 0
    - gpg_key_name | default('') | length > 0
  tags: dotfiles

- name: Set gitconfig_signingkey from keyring.
  set_fact:
    gitconfig_signingkey: "{{ _gpg_signing_key_lookup.stdout | trim }}"
  when:
    - gitconfig_signingkey | length == 0
    - _gpg_signing_key_lookup is defined
    - _gpg_signing_key_lookup.rc | default(1) == 0
    - _gpg_signing_key_lookup.stdout | trim | length > 0
  tags: dotfiles

- name: Render discovered templates into managed directory.
  template:
    src: "{{ template_relpath }}"
    dest: "{{ dotfiles_repo_local_destination }}/{{ template_relpath }}"
    mode: "0644"
  vars:
    template_relpath: "{{ item.path.split('/templates/', 1)[1] }}"
  loop: "{{ discovered_templates.files | sort(attribute='path') }}"
  tags: dotfiles

- name: Link configured dotfiles into home folder.
  file:
    src: "{{ dotfiles_repo_local_destination }}/{{ item }}"
    dest: "{{ dotfiles_home }}/{{ item }}"
    state: link
    force: true
  become: false
  loop: "{{ templated_dotfiles | unique }}"
  tags: dotfiles

---
configure_terminal: yes
configure_osx: yes
configure_dotfiles: yes
configure_gpg: yes
configure_ssh: yes
configure_github_keys: yes

dotfiles_repo_local_destination: "{{ dotfiles_host_home }}/dotfiles"
dotfiles_files:
  - .aliases
  - .zshrc
  - .vimrc
  - .osx
  - .functions
  - .iterm2_shell_integration.zsh
  - .inputrc

gitconfig_name: "{{ lookup('ansible.builtin.env', 'GITCONFIG_NAME', default='') }}"
gitconfig_email: "{{ lookup('ansible.builtin.env', 'GITCONFIG_EMAIL', default='') }}"
gitconfig_signingkey: "{{ lookup('ansible.builtin.env', 'GITCONFIG_SIGNINGKEY', default='') }}"
gitconfig_github_user: "{{ lookup('ansible.builtin.env', 'GITCONFIG_GITHUB_USER', default='') }}"

gpg_key_name: "{{ lookup('ansible.builtin.env', 'GPG_KEY_NAME', default=gitconfig_name) }}"
gpg_key_email: "{{ lookup('ansible.builtin.env', 'GPG_KEY_EMAIL', default=gitconfig_email) }}"
gpg_key_passphrase: "{{ lookup('ansible.builtin.env', 'GPG_KEY_PASSPHRASE', default='') }}"

ssh_key_comment: "{{ lookup('ansible.builtin.env', 'SSH_KEY_COMMENT', default=gitconfig_email) }}"
ssh_key_passphrase: "{{ lookup('ansible.builtin.env', 'SSH_KEY_PASSPHRASE', default='') }}"
github_gpg_key_title: "{{ lookup('ansible.builtin.env', 'GH_GPG_KEY_TITLE', default='Mac DevOps GPG Key') }}"
github_ssh_key_title: "{{ lookup('ansible.builtin.env', 'GH_SSH_KEY_TITLE', default='Mac DevOps SSH Key') }}"

homebrew_installed_packages:
  # Dev
  - act
  - ansible
  - autoconf
  - automake
  - aws-iam-authenticator
  - azure-cli
  - bash
  - bash-completion@2
  - ca-certificates
  - coreutils
  - curl
  - dive
  - doctl
  - eksctl
  - gawk
  - gettext
  - gh
  - git
  - git-secret
  - gnu-getopt
  - gnu-sed
  - gnupg
  - gnutls
  - go
  - hashicorp/tap/terraform
  - hashicorp/tap/vault
  - helm
  - helmfile
  - homebrew/cask/hey
  - httperf
  - istioctl
  - jpeg
  - jq
  - k9s
  - kind
  - kompose
  - kops
  - kubernetes-cli
  - kube-ps1
  - kubeconform
  - kustomize
  - minikube
  - mas
  - moreutils
  - mpdecimal
  - nmap
  - node
  - nvm
  - openapi-generator
  - openjdk
  - openldap
  - openssl@1.1
  - php
  - pinentry-mac
  - pkg-config
  - podman
  - python@3.10
  - python@3.8
  - python@3.9
  - qemu
  - readline
  - ruby
  - scw
  - shellcheck
  - skaffold
  - sops
  - sqlite
  - stern
  - terraform
  - tree
  - tmux
  - watch
  - wget
  - yarn
  - yq
  - zsh

homebrew_taps:
  - hashicorp/tap

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - alfred
  - docker
  - dropbox # Client for the Dropbox cloud storage service
  - firefox
  - google-chrome
  - google-cloud-sdk
  - iterm2
  - kap # Open-source screen recorder built with web technology
  - postman # Collaboration platform for API development
  - slack # Team communication and collaboration software
  - sourcetree # Graphical client for Git version control
  - vagrant
  - virtualbox
  - visual-studio-code
  - vlc # VLC media player

